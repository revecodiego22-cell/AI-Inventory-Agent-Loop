[project]
name = "ai-inventory-agent-loop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "revecodiego22-cell", email = "revecodiego22@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "openai>=3.59.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-inventory-agent-loop = "ai_inventory_agent_loop:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
